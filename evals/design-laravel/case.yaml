schema_version: "1.1"
name: design-laravel
expected_outcome: |
  /pixie:design explores 2 directions for a recent-orders section on the Laravel fixture's dashboard, starting
  from a correct design inventory. The first direction wins. It's built into production Blade from the catalogued
  <x-alert>, never the legacy partials.alert and without raw colours, with one passing test per state of its
  matrix. Its preview stays in a permanent /__preview route registered only in the local environment. The losing
  direction's files are gone, and a decision record is written under docs/design/decisions/.
context:
  scaffold_script: place-files.sh
